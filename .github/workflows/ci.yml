name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ⭐ 缓存 node_modules 本身，不只是 ~/.npm。
      # setup-node 的 `cache: npm` 只存下载的 tarball；npm ci 每次照样把
      # 300+ 个包删掉重解压 —— react-native 那种几万个小文件，解压才是瓶颈。
      # key 里锁了 os + node 版本 + lockfile 哈希，依赖一变就自然失效。
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      - run: npm run typecheck
      - run: npm test
